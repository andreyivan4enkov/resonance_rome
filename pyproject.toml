[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-rome"
version = "0.1.0"
description = "Resonance-weighted covariance for ROME/MEMIT factual model editing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["resonance_rome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
